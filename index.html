<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Er Sajida Khan - Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Previous CSS remains the same, just adding chatbot improvements */
        
        /* Enhanced Chatbot Styles */
        .chatbot-widget {
            position: fixed;
            bottom: 30px;
            right: 100px;
            width: 60px;
            height: 60px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: var(--shadow-hover);
            transition: var(--transition);
            z-index: 999;
            cursor: pointer;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        .chatbot-widget:hover {
            background: var(--primary-dark);
            transform: scale(1.1);
            animation: none;
        }
        
        .chatbot-container {
            position: fixed;
            bottom: 100px;
            right: 30px;
            width: 350px;
            height: 450px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            display: none;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--light-gray);
        }
        
        .chatbot-container.active {
            display: flex;
            animation: slideInUp 0.3s ease;
        }
        
        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .chatbot-header {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .chatbot-header h3 {
            margin: 0;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .chatbot-header h3 i {
            font-size: 1rem;
        }
        
        .close-chatbot {
            background: none;
            border: none;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .close-chatbot:hover {
            transform: rotate(90deg);
        }
        
        .chatbot-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #f8f9fa;
        }
        
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.9rem;
            line-height: 1.4;
            position: relative;
            animation: messageAppear 0.3s ease;
        }
        
        @keyframes messageAppear {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .bot-message {
            background: white;
            align-self: flex-start;
            border-bottom-left-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border: 1px solid var(--light-gray);
        }
        
        .user-message {
            background: var(--primary);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 5px;
            box-shadow: 0 2px 5px rgba(108, 99, 255, 0.3);
        }
        
        .chatbot-input {
            padding: 15px;
            border-top: 1px solid var(--light-gray);
            display: flex;
            gap: 10px;
            background: white;
        }
        
        .chatbot-input input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid var(--light-gray);
            border-radius: 25px;
            outline: none;
            font-family: 'Poppins', sans-serif;
            transition: var(--transition);
        }
        
        .chatbot-input input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(108, 99, 255, 0.1);
        }
        
        .chatbot-input button {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .chatbot-input button:hover {
            background: var(--primary-dark);
            transform: scale(1.05);
        }
        
        .chatbot-input button:disabled {
            background: var(--gray);
            cursor: not-allowed;
            transform: none;
        }
        
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 12px 16px;
            background: white;
            border-radius: 18px;
            border-bottom-left-radius: 5px;
            align-self: flex-start;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border: 1px solid var(--light-gray);
        }
        
        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--gray);
            border-radius: 50%;
            animation: typingAnimation 1.4s infinite ease-in-out;
        }
        
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes typingAnimation {
            0%, 80%, 100% { transform: scale(0.8); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }
        
        .quick-replies {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        
        .quick-reply {
            background: white;
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .quick-reply:hover {
            background: var(--primary);
            color: white;
        }
        
        /* Dark mode chatbot styles */
        body.dark-mode .chatbot-container {
            background: #2d3748;
            border-color: #4a5568;
        }
        
        body.dark-mode .chatbot-messages {
            background: #1a202c;
        }
        
        body.dark-mode .bot-message {
            background: #4a5568;
            color: #f7fafc;
            border-color: #4a5568;
        }
        
        body.dark-mode .typing-indicator {
            background: #4a5568;
            border-color: #4a5568;
        }
        
        body.dark-mode .chatbot-input {
            background: #2d3748;
            border-color: #4a5568;
        }
        
        body.dark-mode .chatbot-input input {
            background: #4a5568;
            border-color: #4a5568;
            color: #f7fafc;
        }
        
        body.dark-mode .chatbot-input input:focus {
            border-color: var(--primary);
        }
        
        body.dark-mode .quick-reply {
            background: #4a5568;
            color: #f7fafc;
            border-color: var(--primary);
        }
        
        body.dark-mode .quick-reply:hover {
            background: var(--primary);
        }
        
        /* Responsive improvements */
        @media (max-width: 768px) {
            .chatbot-container {
                width: 300px;
                height: 400px;
                right: 20px;
                bottom: 80px;
            }
            
            .chatbot-widget {
                right: 30px;
                bottom: 30px;
            }
        }
        
        @media (max-width: 576px) {
            .chatbot-container {
                width: 280px;
                right: 10px;
            }
        }
    </style>
</head>
<body>
    <!-- Previous HTML content remains the same until the chatbot section -->

    <!-- Chatbot Widget -->
    <div class="chatbot-widget" id="chatbotWidget">
        <i class="fas fa-robot"></i>
    </div>

    <!-- Chatbot Container -->
    <div class="chatbot-container" id="chatbotContainer">
        <div class="chatbot-header">
            <h3><i class="fas fa-robot"></i> Portfolio Assistant</h3>
            <button class="close-chatbot" id="closeChatbot">&times;</button>
        </div>
        <div class="chatbot-messages" id="chatbotMessages">
            <div class="message bot-message">
                Hello! I'm your portfolio assistant. I can help you learn more about Sajida's skills, experience, and projects. How can I assist you today?
                <div class="quick-replies">
                    <div class="quick-reply" data-reply="skills">View Skills</div>
                    <div class="quick-reply" data-reply="experience">Work Experience</div>
                    <div class="quick-reply" data-reply="projects">See Projects</div>
                    <div class="quick-reply" data-reply="contact">Contact Info</div>
                </div>
            </div>
        </div>
        <div class="chatbot-input">
            <input type="text" id="chatbotInput" placeholder="Type your message...">
            <button id="sendMessage"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <!-- Rest of your HTML content remains the same -->

    <script>
        // Enhanced AI Assistant Functionality
        document.addEventListener('DOMContentLoaded', function() {
            // Chatbot elements
            const chatbotWidget = document.getElementById('chatbotWidget');
            const chatbotContainer = document.getElementById('chatbotContainer');
            const closeChatbot = document.getElementById('closeChatbot');
            const chatbotMessages = document.getElementById('chatbotMessages');
            const chatbotInput = document.getElementById('chatbotInput');
            const sendMessage = document.getElementById('sendMessage');
            
            // Chatbot state
            let isTyping = false;
            
            // Initialize chatbot
            function initChatbot() {
                // Add welcome message if no messages exist
                if (chatbotMessages.children.length === 1) {
                    // Welcome message is already in HTML
                }
            }
            
            // Toggle chatbot visibility
            chatbotWidget.addEventListener('click', function() {
                chatbotContainer.classList.toggle('active');
                if (chatbotContainer.classList.contains('active')) {
                    chatbotInput.focus();
                }
            });
            
            // Close chatbot
            closeChatbot.addEventListener('click', function() {
                chatbotContainer.classList.remove('active');
            });
            
            // Add message to chat
            function addMessage(message, isUser = false, showQuickReplies = false) {
                const messageDiv = document.createElement('div');
                messageDiv.classList.add('message');
                messageDiv.classList.add(isUser ? 'user-message' : 'bot-message');
                messageDiv.textContent = message;
                
                // Add quick replies for bot messages if requested
                if (!isUser && showQuickReplies) {
                    const quickReplies = document.createElement('div');
                    quickReplies.classList.add('quick-replies');
                    quickReplies.innerHTML = `
                        <div class="quick-reply" data-reply="skills">Skills</div>
                        <div class="quick-reply" data-reply="experience">Experience</div>
                        <div class="quick-reply" data-reply="projects">Projects</div>
                        <div class="quick-reply" data-reply="contact">Contact</div>
                        <div class="quick-reply" data-reply="services">Services</div>
                    `;
                    messageDiv.appendChild(quickReplies);
                    
                    // Add event listeners to quick replies
                    setTimeout(() => {
                        const replyButtons = quickReplies.querySelectorAll('.quick-reply');
                        replyButtons.forEach(button => {
                            button.addEventListener('click', function() {
                                handleQuickReply(this.getAttribute('data-reply'));
                            });
                        });
                    }, 100);
                }
                
                chatbotMessages.appendChild(messageDiv);
                chatbotMessages.scrollTop = chatbotMessages.scrollHeight;
            }
            
            // Show typing indicator
            function showTypingIndicator() {
                if (isTyping) return;
                
                isTyping = true;
                const typingDiv = document.createElement('div');
                typingDiv.classList.add('typing-indicator');
                typingDiv.id = 'typingIndicator';
                typingDiv.innerHTML = `
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                `;
                chatbotMessages.appendChild(typingDiv);
                chatbotMessages.scrollTop = chatbotMessages.scrollHeight;
            }
            
            // Hide typing indicator
            function hideTypingIndicator() {
                isTyping = false;
                const typingIndicator = document.getElementById('typingIndicator');
                if (typingIndicator) {
                    typingIndicator.remove();
                }
            }
            
            // Handle quick replies
            function handleQuickReply(replyType) {
                let message = "";
                switch(replyType) {
                    case "skills":
                        message = "Tell me about Sajida's technical skills";
                        break;
                    case "experience":
                        message = "What is Sajida's work experience?";
                        break;
                    case "projects":
                        message = "Show me Sajida's projects";
                        break;
                    case "contact":
                        message = "How can I contact Sajida?";
                        break;
                    case "services":
                        message = "What services does Sajida offer?";
                        break;
                }
                
                chatbotInput.value = message;
                handleUserMessage();
            }
            
            // Process user message and generate response
            function processUserMessage(message) {
                const lowerMessage = message.toLowerCase();
                
                // Greetings
                if (lowerMessage.includes('hello') || lowerMessage.includes('hi') || lowerMessage.includes('hey')) {
                    return "Hello! I'm Sajida's portfolio assistant. How can I help you learn more about her skills and experience?";
                }
                
                // Skills
                if (lowerMessage.includes('skill') || lowerMessage.includes('technology') || lowerMessage.includes('tech stack')) {
                    return "Sajida has expertise in: HTML/CSS, JavaScript, React, Node.js, Python, UI/UX Design, Responsive Design, MongoDB, Git, AWS, and Data Science. She has completed 500+ projects using these technologies. You can click on any skill in the About section to see specific projects!";
                }
                
                // Experience
                if (lowerMessage.includes('experience') || lowerMessage.includes('work') || lowerMessage.includes('job') || lowerMessage.includes('career')) {
                    return "Sajida has over 10 years of experience in web development and education:\n\n• 2025-Present: Trainer & Tutor at Bambinos.io & Superprof\n• 2024-2025: Technical Support Engineer at Gao Tek, New York\n• 2021-2023: Admission Counselor at Narayana E Techno School\n• 2018-2021: Computer Science Tutor at IITFA, Faridabad\n• 2014-Present: Remote Tutor & Senior Trainer at Superprof\n\nCheck the Experience section for detailed information!";
                }
                
                // Projects
                if (lowerMessage.includes('project') || lowerMessage.includes('portfolio') || lowerMessage.includes('work sample')) {
                    return "Sajida has completed 500+ projects including:\n\n• E-commerce platforms\n• Task management applications\n• Analytics dashboards\n• Responsive websites\n• Data science projects\n\nYou can view some of her featured projects in the Projects section. Each skill also has specific projects you can explore!";
                }
                
                // Contact
                if (lowerMessage.includes('contact') || lowerMessage.includes('email') || lowerMessage.includes('phone') || lowerMessage.includes('reach')) {
                    return "You can contact Sajida through:\n\n• Email: sajidakhan3610@gmail.com\n• Phone: +91 8826197747\n• Location: Batla House, Jamia Nagar, Okhla, Delhi, India\n\nFeel free to use the contact form on this website to send her a message directly!";
                }
                
                // Services
                if (lowerMessage.includes('service') || lowerMessage.includes('offer') || lowerMessage.includes('provide')) {
                    return "Sajida offers the following services:\n\n• Web Development\n• UI/UX Design\n• Tech Tutoring & Mentoring\n• E-commerce Solutions\n• SEO Optimization\n• Cloud Solutions\n\nCheck the Services section for more details about each offering!";
                }
                
                // Education/Teaching
                if (lowerMessage.includes('teach') || lowerMessage.includes('tutor') || lowerMessage.includes('education') || lowerMessage.includes('student')) {
                    return "Sajida has extensive experience in education and tutoring:\n\n• She has been a remote tutor since 2014 with Superprof\n• Currently teaches at Bambinos.io\n• Has helped 1000+ students learn programming\n• Specializes in web development and computer science\n• Maintains a 4.9/5 rating across teaching platforms";
                }
                
                // About
                if (lowerMessage.includes('about') || lowerMessage.includes('who') || lowerMessage.includes('background')) {
                    return "Sajida Khan is a full-stack developer and educator with over 10 years of experience. She combines technical expertise with teaching skills to create amazing digital solutions while mentoring the next generation of developers. She's passionate about creating user-friendly applications and sharing knowledge.";
                }
                
                // Default response
                return "I'm here to help you learn more about Sajida's portfolio! You can ask me about:\n\n• Her skills and technologies\n• Work experience\n• Projects\n• Contact information\n• Services offered\n• Teaching experience\n\nWhat would you like to know?";
            }
            
            // Handle user message
            function handleUserMessage() {
                const message = chatbotInput.value.trim();
                if (message) {
                    // Add user message
                    addMessage(message, true);
                    chatbotInput.value = '';
                    
                    // Disable send button while processing
                    sendMessage.disabled = true;
                    
                    // Show typing indicator
                    showTypingIndicator();
                    
                    // Simulate processing delay
                    setTimeout(function() {
                        hideTypingIndicator();
                        
                        // Generate and add bot response
                        const response = processUserMessage(message);
                        addMessage(response, false, true);
                        
                        // Re-enable send button
                        sendMessage.disabled = false;
                        chatbotInput.focus();
                    }, 1500);
                }
            }
            
            // Send message on button click
            sendMessage.addEventListener('click', handleUserMessage);
            
            // Send message on Enter key
            chatbotInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    handleUserMessage();
                }
            });
            
            // Close chatbot when clicking outside (on mobile)
            document.addEventListener('click', function(e) {
                if (!chatbotContainer.contains(e.target) && 
                    !chatbotWidget.contains(e.target) && 
                    chatbotContainer.classList.contains('active')) {
                    chatbotContainer.classList.remove('active');
                }
            });
            
            // Initialize chatbot
            initChatbot();
            
            // Rest of your existing JavaScript code...
            
            // Previous JavaScript code for other functionality remains the same
            // (particles, dark mode, navigation, animations, etc.)
            
        }); // End of DOMContentLoaded
    </script>
</body>
</html>
